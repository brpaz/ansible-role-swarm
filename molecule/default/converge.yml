- name: Converge
  hosts: all
  vars:
    docker_install_compose: false

  pre_tasks:
    - name: Update apt cache.
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_os_family == 'Debian'

    - name: Install Ansible dependencies.
      ansible.builtin.package:
        name:
          - python3-pip
          - python3-docker
        state: present
      when: ansible_os_family == 'Debian'

    - name: Install docker
      ansible.builtin.include_role:
        name: geerlingguy.docker
      vars:
        # The molecule test container's own docker storage is already
        # overlay2; nesting another overlay2 daemon on top of it fails
        # to mount ("invalid argument") on current CI runner images.
        docker_daemon_options:
          storage-driver: vfs

  tasks:
    - name: Include Docker Swarm role
      ansible.builtin.include_role:
        name: brpaz.swarm
